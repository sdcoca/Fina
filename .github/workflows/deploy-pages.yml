name: Deploy PWA to GitHub Pages

# Publishes the contents of web/ (the Pyodide-based PWA shell) to GitHub Pages, unmodified --
# no build step, since web/ is already a static, self-contained site (see docs/plan/plan for
# WP-10..WP-18). Triggered on every push to this branch, plus a manual button in the Actions
# tab for a one-off re-deploy without a new commit.
on:
  push:
    branches:
      - claude/prompt-review-planning-ag8rwf
  workflow_dispatch: {}

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: web
      - id: deployment
        uses: actions/deploy-pages@v4
